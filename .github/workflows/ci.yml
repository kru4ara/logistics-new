name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Verify vitest is installed
        run: |
          echo "Checking for vitest..."
          ls node_modules/.bin/ | grep vitest || echo "VITEST NOT FOUND IN BIN"
          ls node_modules/vitest 2>/dev/null && echo "VITEST PACKAGE EXISTS" || echo "VITEST PACKAGE MISSING"
          cat package.json | grep -A 2 '"test"'

      - name: Run Linter
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"

name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install dependencies
        run: npm ci --include=dev

      - name: Debug vitest
        run: |
          echo "=== node_modules/.bin ==="
          ls node_modules/.bin/ | grep -i vitest || echo "NOT FOUND"
          echo "=== package.json test script ==="
          grep '"test"' package.json

      - name: Run Linter
        run: npm run lint

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Run Tests
        run: npm run test
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"

      - name: Build Next.js
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-anon-key"

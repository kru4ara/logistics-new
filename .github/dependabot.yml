# Обновления зависимостей: раз в неделю, мелкие — одним PR, чтобы не было лавины.
# Уязвимости (security updates) Dependabot присылает сразу, вне расписания, —
# если в Settings → Code security включены Dependabot alerts и security updates.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Warsaw
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    # next и react — только вручную: у next свои миграции (см. AGENTS.md).
    ignore:
      - dependency-name: next
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      # TypeScript 7 (нативный компилятор) пока не поддерживает сборка Next — ждём.
      - dependency-name: typescript
        update-types: [version-update:semver-major]
      # @supabase/ssr отвечает за вход: обновлять отдельно, с проверкой входа на превью.
      - dependency-name: "@supabase/ssr"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]
